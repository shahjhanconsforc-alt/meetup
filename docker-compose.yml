# Full meetup-bot stack: the app + its dependency (MinIO).
#
#   1.  cp .env.example .env   and fill in MINIO_USER / MINIO_PASSWORD (+ Meetup creds)
#   2.  on the VM desktop, once per login:  xhost +SI:localuser:root
#   3.  docker compose up -d --build
#   4.  open http://<vm-ip>:4200 - the browser windows open on the VM's desktop
#
# Compose reads MINIO_USER / MINIO_PASSWORD from .env, so the same credentials
# seed the MinIO server AND the app — set them in one place.
#
# Host ports are overridable in .env so this can share a VM with the sibling bots.
services:
  app:
    build: .
    container_name: meetup-bot
    init: true
    shm_size: "1gb"          # Chromium crashes tabs on Docker's 64 MB default
    ports:
      - "${PORT:-4200}:4200"
    environment:
      HOST: 0.0.0.0
      PORT: 4200
      ENV: production
      TZ: ${TZ:-UTC}
      # Reach the sibling service by its compose DNS name, not localhost.
      MINIO_URL: minio:9000
      MINIO_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-meetup-members}
      MINIO_BUCKET_SESSIONS: ${MINIO_BUCKET_SESSIONS:-meetup-sessions}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-meetup-media}
      MINIO_BUCKET_MESSAGES: ${MINIO_BUCKET_MESSAGES:-meetup-messages}
      # Headed Chromium on the VM's own desktop (its X display, usually :0).
      # No desktop / nothing to watch: DISPLAY_MODE=headless and
      # PLAYWRIGHT_HEADLESS=true in .env.
      DISPLAY_MODE: ${DISPLAY_MODE:-host}
      DISPLAY: ${DISPLAY:-:0}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-false}
      PLAYWRIGHT_CHANNEL: chromium
      PLAYWRIGHT_NO_SANDBOX: "true"
      PLAYWRIGHT_CLEAN_LAUNCH: "true"
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_BYPASS: ${PROXY_BYPASS:-localhost,127.0.0.1,minio}
      MU_USERNAME: ${MU_USERNAME:-}
      MU_PASSWORD: ${MU_PASSWORD:-}
    volumes:
      - app_data:/app/backend/data     # store.json, screenshots, chrome profiles
      - /tmp/.X11-unix:/tmp/.X11-unix  # the VM desktop's X socket
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: meetup-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
  app_data:
